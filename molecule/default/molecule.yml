---
driver:
  name: docker
platforms:
  - name: instance
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-debian13-ansible:latest}"
    command: ""
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    # The role is the repository root; make it resolvable by directory name.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  config_options:
    defaults:
      interpreter_python: auto_silent
      callbacks_enabled: profile_tasks
verifier:
  name: ansible
